name: vibe_power
description: Plugin local de Vibe Player — maintien de l'écran allumé (FLAG_KEEP_SCREEN_ON) et état du mode économie d'énergie Android.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.vibe_power
        pluginClass: VibePowerPlugin
